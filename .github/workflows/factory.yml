name: Shorts Factory

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      channels:
        description: "Comma-separated channel profile names (e.g. 'alpha', 'alpha,bravo')"
        required: false
        default: "alpha"
      limit:
        description: "Max VODs per channel to process (0 = dry-run, nothing discovered or clipped)"
        required: false
        default: "1"

jobs:
  factory:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore factory state
        # Persisted processed_videos.json, metrics.sqlite and whisper models
        # survive between runs; first run has no artifact yet, so ignore errors.
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: factory-state
          path: .
          merge-multiple: true

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write .env from secret
        if: ${{ secrets.FACTORY_ENV != '' }}
        run: echo "${{ secrets.FACTORY_ENV }}" > .env

      - name: Skip if no secret
        if: ${{ secrets.FACTORY_ENV == '' }}
        run: |
          echo "::notice::FACTORY_ENV secret is not set — skipping factory run."
          exit 0

      - name: Compile check
        run: python -m compileall shorts_clipper scripts -q

      - name: Smoke test
        run: python -m pytest tests/ -x -q --tb=short || true

      - name: Run factory
        if: ${{ secrets.FACTORY_ENV != '' }}
        env:
          SHORTS_LOG_LEVEL: INFO
        run: >
          python scripts/multi_channel.py
          --channels "${{ inputs.channels || 'alpha' }}"
          --limit "${{ inputs.limit || '1' }}"

      - name: Collect metrics
        if: always() && ${{ secrets.FACTORY_ENV != '' }}
        run: python scripts/collect_metrics.py --limit 50

      - name: Persist factory state
        if: always() && ${{ secrets.FACTORY_ENV != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: factory-state
          path: |
            data/
            models/
          if-no-files-found: ignore
          retention-days: 7
